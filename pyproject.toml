[project]
name = "log-aggregator"
version = "0.1.0"
dependencies = [
  "fastapi[standard]",
  "uvicorn[standard]",
  "aiosqlite",
  "pytest",
  "pytest-asyncio",
  "python-dotenv",
  "pytest-dotenv",
  "httpx",
  "aiohttp>=3.13.1",
]
requires-python = ">=3.13"

[tool.pytest.ini_options]
asyncio_mode = "auto"
log_cli = true
log_cli_level = "INFO"
